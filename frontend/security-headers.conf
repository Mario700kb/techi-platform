# Security headers for every response. Included in server{} AND in each
# location that sets its own headers: an add_header inside a location
# discards every add_header inherited from server{}.
#
# CSP: no inline or eval'd script — the boot scripts are files under /boot/.
# style-src keeps 'unsafe-inline' for React style attributes. JetBrains Mono
# is self-hosted under /fonts/, so no font or style CDN is allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api-rdp.techi.com.al wss://api-rdp.techi.com.al; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
