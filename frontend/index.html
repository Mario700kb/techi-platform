<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />

      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
