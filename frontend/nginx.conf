server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Security headers live in one snippet (CSP, HSTS, Permissions-Policy…).
    # Any location that sets its own add_header must include it again.
    include /etc/nginx/snippets/security-headers.conf;

    # PWA manifest — revalidate daily (icons/name may change with branding)
    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "application/manifest+json" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker — must never be cached; browser checks on every page load
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # PWA icons — daily cache (not immutable; may update with branding changes)
    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Root-level app icons — same daily (non-immutable) policy as /icons/.
    # These are outside /icons/ (referenced directly from index.html's
    # <link rel="apple-touch-icon">/<link rel="icon">) and would otherwise
    # fall through to the generic \.png$ rule below, which is immutable for
    # a full year — exactly what let apple-touch-icon.png silently go stale
    # after a rebrand (fixed 2026-07-06: the file itself was months out of
    # date, and this 1-year header meant no amount of removing/re-adding to
    # the iOS home screen would ever pick up a fresh copy).
    location ~* ^/(favicon\.svg|favicon\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Boot scripts (theme, preloader) are not content-hashed, so they must
    # not fall through to the 1-year immutable *.js rule below.
    location ^~ /boot/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The HTML shell must always be revalidated because it points at hashed
    # bundles that change with each image.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed Vite assets are immutable. Never fall back to index.html here:
    # missing assets must be a real 404, not HTML with a CSS/JS MIME mismatch.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback - all unknown application paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache non-bundle static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
