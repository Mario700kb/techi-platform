server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # NOTE: add_header inside a location block discards every add_header
    # inherited from server{}, so the security trio must be repeated in any
    # location that sets its own headers (e.g. Cache-Control).
    # JetBrains Mono is self-hosted under /fonts/ (2026-07-06) — the Google
    # Fonts origins are intentionally absent from style-src/font-src.
    set $csp "default-src 'self'; connect-src 'self' wss://api-rdp.techi.com.al https://api-rdp.techi.com.al; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; worker-src 'self'; frame-ancestors 'none';";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;

    # PWA manifest — revalidate daily (icons/name may change with branding)
    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "application/manifest+json" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Service worker — must never be cached; browser checks on every page load
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # PWA icons — daily cache (not immutable; may update with branding changes)
    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Root-level app icons — same daily (non-immutable) policy as /icons/.
    # These are outside /icons/ (referenced directly from index.html's
    # <link rel="apple-touch-icon">/<link rel="icon">) and would otherwise
    # fall through to the generic \.png$ rule below, which is immutable for
    # a full year — exactly what let apple-touch-icon.png silently go stale
    # after a rebrand (fixed 2026-07-06: the file itself was months out of
    # date, and this 1-year header meant no amount of removing/re-adding to
    # the iOS home screen would ever pick up a fresh copy).
    location ~* ^/(favicon\.svg|favicon\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # The HTML shell must always be revalidated because it points at hashed
    # bundles that change with each image.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Hashed Vite assets are immutable. Never fall back to index.html here:
    # missing assets must be a real 404, not HTML with a CSS/JS MIME mismatch.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # SPA fallback - all unknown application paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # Cache non-bundle static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
