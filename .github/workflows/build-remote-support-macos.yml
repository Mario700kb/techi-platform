name: Build TECHI Remote Support macOS Components

on:
  push:
    branches:
      - stable/phase-2-heartbeat
    paths:
      - 'remote-support-bridge/**'
      - 'remote-support-macos/**'
      - 'scripts/build-macos-remote-support.sh'
      - 'scripts/test_macos_remote_support_packaging.sh'
      - 'scripts/verify_macos_remote_support_artifacts.py'
      - 'scripts/verify_macos_remote_support_connect_security.py'
      - 'backend/app/schemas/agent_package.py'
      - 'backend/app/services/agent_package_service.py'
      - 'backend/app/api/v1/endpoints/agent_packages.py'
      - 'frontend/src/api/agentPackages.ts'
      - 'frontend/src/pages/AgentPackages.tsx'
      - '.github/workflows/build-remote-support-macos.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos-components:
    name: Build macOS bridge and launcher
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.21'
          cache-dependency-path: remote-support-bridge/go.sum

      - name: Install DMG builder
        run: brew install create-dmg

      - name: Test shared and macOS bridge
        working-directory: remote-support-bridge
        run: go test ./...

      - name: Build macOS bridge
        working-directory: remote-support-bridge
        run: |
          VERSION=$(tr -d '[:space:]' < ../remote-support-macos/VERSION)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o ../techi-remote-support-bridge .

      - name: Typecheck and build AppKit launcher
        run: |
          swiftc -typecheck -framework AppKit -target arm64-apple-macos12.3 \
            remote-support-macos/Launcher.swift
          swiftc -O -whole-module-optimization -framework AppKit \
            -target arm64-apple-macos12.3 \
            remote-support-macos/Launcher.swift -o "TECHI Remote Support"

      - name: Typecheck package process control
        run: |
          swiftc -typecheck -framework AppKit -target arm64-apple-macos12.3 \
            remote-support-macos/PackageProcessControl.swift
          swiftc -O -whole-module-optimization -framework AppKit \
            -target arm64-apple-macos12.3 \
            remote-support-macos/PackageProcessControl.swift -o package-process-control

      - name: Validate package scripts
        run: bash -n scripts/build-macos-remote-support.sh remote-support-macos/package-scripts/preinstall remote-support-macos/package-scripts/postinstall

      - name: Verify security contract
        run: python3 scripts/verify_macos_remote_support_connect_security.py

      - name: Build and verify isolated DMG and PKG
        run: scripts/test_macos_remote_support_packaging.sh

      - name: Report signing and notarization status
        run: |
          echo "macOS component signing status: UNSIGNED"
          echo "macOS component notarization status: NOT_NOTARIZED"

      - name: Upload tested launcher components
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Remote-Support-macOS-components-1.4.8
          retention-days: 30
          if-no-files-found: error
          path: |
            techi-remote-support-bridge
            TECHI Remote Support
            package-process-control
            remote-support-macos/VERSION
            remote-support-macos/BUILD_VERSION
