name: Frontend CI

# The same gate scripts/preflight.sh runs locally, enforced on every push and
# pull request that touches the frontend: types, lint, formatting, tests,
# production build and a dependency audit of what ships to browsers.

on:
  push:
    branches:
      - backport/platform-components-92a521c
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # vite.config.ts refuses a production build without the real API URL;
      # .env.production is committed, so this is the exact production build.
      - name: Production build
        run: npm run build

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Production bundle (--mode e2e) against an in-browser mock API: sign-in
      # and 2FA, navigation, 404 / access denied, and axe (WCAG 2.1 AA) on
      # desktop and phone, dark and light.
      - name: Playwright
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
