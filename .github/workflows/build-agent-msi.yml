name: Build TECHI Agent MSI

on:
  push:
    branches:
      - stable/phase-2-heartbeat
    paths:
      - 'agent/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-msi:
    name: Build MSI (windows-latest)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout                                                          #
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Go 1.21                                                           #
      # ------------------------------------------------------------------ #
      - name: Setup Go 1.21
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      # ------------------------------------------------------------------ #
      # 3. WiX v4 + Util extension (për util:ServiceConfig)                 #
      # ------------------------------------------------------------------ #
      - name: Install WiX v4 + Util extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.Util.wixext/4.0.5

      # ------------------------------------------------------------------ #
      # 4. Lexo versionin nga agent/VERSION (burimi i vetem i se vertetes)   #
      # ------------------------------------------------------------------ #
      - name: Read agent version
        id: version
        shell: pwsh
        working-directory: agent
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "agent/VERSION is empty"
          }
          Write-Host "Agent version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------------ #
      # 5. Build techi-agent.exe (native Windows — nuk nevojitet GOOS)      #
      # ------------------------------------------------------------------ #
      - name: Build techi-agent.exe
        shell: pwsh
        working-directory: agent
        run: go build -ldflags="-s -w -X main.AgentVersion=${{ steps.version.outputs.version }}" -o installer/techi-agent.exe .

      # ------------------------------------------------------------------ #
      # 6. Build MSI me WiX v4                                              #
      # ------------------------------------------------------------------ #
      - name: Build MSI
        shell: pwsh
        working-directory: agent/installer
        run: |
          wix build installer.wxs `
            -ext WixToolset.Util.wixext `
            -d SourceDir=. `
            -d Version=${{ steps.version.outputs.version }} `
            -o TECHI-Endpoint-Deployment-${{ steps.version.outputs.version }}.msi

      # ------------------------------------------------------------------ #
      # 7. SHA256 checksum                                                   #
      # ------------------------------------------------------------------ #
      - name: Compute SHA256
        shell: pwsh
        working-directory: agent/installer
        run: |
          $msi = "TECHI-Endpoint-Deployment-${{ steps.version.outputs.version }}.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $msi" | Out-File "$msi.sha256" -Encoding utf8NoBOM
          Write-Host "SHA256: $hash"

      # ------------------------------------------------------------------ #
      # 8. Upload artifact (30 ditë)                                         #
      # ------------------------------------------------------------------ #
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Endpoint-Deployment-${{ steps.version.outputs.version }}
          path: |
            agent/installer/TECHI-Endpoint-Deployment-${{ steps.version.outputs.version }}.msi
            agent/installer/TECHI-Endpoint-Deployment-${{ steps.version.outputs.version }}.msi.sha256
          retention-days: 30
          if-no-files-found: error
