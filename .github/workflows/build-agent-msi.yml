name: Build TECHI Agent MSI

on:
  push:
    branches:
      - stable/phase-2-heartbeat
    paths:
      - 'agent/**'
      - 'remote-support-bridge/**'
      - 'scripts/verify_remote_support_connect_security.py'
      - 'backend/app/services/bootstrap_config_contract.py'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REQUIRE_SIGNED_WINDOWS_ARTIFACTS: ${{ vars.REQUIRE_SIGNED_WINDOWS_ARTIFACTS || '0' }}

jobs:
  build-msi:
    name: Build MSI (windows-latest)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout                                                          #
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Go 1.21                                                           #
      # ------------------------------------------------------------------ #
      - name: Setup Go 1.21
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.21'
          cache-dependency-path: |
            agent/go.sum
            remote-support-bridge/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------ #
      # 3. WiX v7 + UI extension (per WixUI_Common dialogs)                 #
      #    WiX v7 kerkon pranim te Open Source Maintenance Fee (OSMF) EULA  #
      #    -- https://docs.firegiant.com/wix/osmf/ -- "wix eula accept"     #
      #    e pranon nje here per-user/per-computer per kete runner.         #
      # ------------------------------------------------------------------ #
      - name: Install WiX v7 + UI and Util extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix extension add --global WixToolset.UI.wixext/7.0.0
          wix extension add --global WixToolset.Util.wixext/7.0.0

      # ------------------------------------------------------------------ #
      # 4. Lexo versionin nga agent/VERSION (burimi i vetem i se vertetes)   #
      # ------------------------------------------------------------------ #
      - name: Read agent version
        id: version
        shell: pwsh
        working-directory: agent
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "agent/VERSION is empty"
          }
          $version4 = "$version.0"
          Write-Host "Agent version: $version ($version4)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------------ #
      # 5. Perditeso versioninfo.json + techi-agent.manifest                #
      # ------------------------------------------------------------------ #
      - name: Update version metadata
        shell: pwsh
        working-directory: agent
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $v4 = "${{ steps.version.outputs.version4 }}"
          $vi = 'versioninfo.json'
          $m = 'techi-agent.manifest'
          $json = Get-Content $vi -Raw | ConvertFrom-Json
          $parts = $v.Split('.')
          $json.FixedFileInfo.FileVersion.Major = [int]$parts[0]
          $json.FixedFileInfo.FileVersion.Minor = [int]$parts[1]
          $json.FixedFileInfo.FileVersion.Patch = [int]$parts[2]
          $json.FixedFileInfo.FileVersion.Build = 0
          $json.FixedFileInfo.ProductVersion.Major = [int]$parts[0]
          $json.FixedFileInfo.ProductVersion.Minor = [int]$parts[1]
          $json.FixedFileInfo.ProductVersion.Patch = [int]$parts[2]
          $json.FixedFileInfo.ProductVersion.Build = 0
          $json.StringFileInfo.FileVersion = $v4
          $json.StringFileInfo.ProductVersion = $v4
          $json | ConvertTo-Json -Depth 8 | Set-Content -Path $vi -Encoding ASCII
          # Anchor to the indented assemblyIdentity version line (^\s+version=).
          # NEVER match the XML declaration <?xml version="1.0"?> — replacing
          # that produced an invalid manifest and a fatal SxS launch failure.
          (Get-Content $m -Raw) `
            -replace '(?m)^(\s+version=")[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(")', ('${1}' + $v4 + '${2}') `
            -replace 'TECHI Platform Endpoint Agent [0-9]+\.[0-9]+\.[0-9]+', ('TECHI Platform Endpoint Agent ' + $v) |
            Set-Content -Path $m -Encoding ASCII

      # ------------------------------------------------------------------ #
      # 6. goversioninfo -> resource.syso (icon + version ne .exe)          #
      # ------------------------------------------------------------------ #
      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate resource.syso
        shell: pwsh
        working-directory: agent
        run: goversioninfo -o resource.syso versioninfo.json

      # ------------------------------------------------------------------ #
      # 7. Build techi-agent.exe (native Windows — nuk nevojitet GOOS)      #
      # ------------------------------------------------------------------ #
      - name: Build techi-agent.exe
        shell: pwsh
        working-directory: agent
        run: go build -ldflags="-s -w -X main.AgentVersion=${{ steps.version.outputs.version }}" -trimpath -o installer/techi-agent.exe .

      - name: Test and build Remote Support Connect Bridge
        shell: pwsh
        working-directory: remote-support-bridge
        run: |
          go test ./...
          go build -ldflags="-s -w -X main.version=1.4.8" -trimpath -o ../agent/installer/techi-remote-support-bridge.exe .

      - name: Sign Agent EXE when release certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
          WINDOWS_CODE_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGNING_TIMESTAMP_URL }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_BASE64)
          if (-not $configured) {
            Write-Host "No production code-signing certificate configured; artifact will be marked unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_TIMESTAMP_URL)) {
            throw "Code-signing configuration is partial; PFX password and RFC3161 timestamp URL are required"
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'techi-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_PFX_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          foreach ($item in @(
            @{ Path = "agent/installer/techi-agent.exe"; Description = "TECHI Platform Endpoint Agent" },
            @{ Path = "agent/installer/techi-remote-support-bridge.exe"; Description = "TECHI Remote Support Connect Bridge" }
          )) {
            & $signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_CODE_SIGNING_TIMESTAMP_URL `
              /f $pfx /p $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD `
              /d $item.Description $item.Path
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($item.Path)" }
          }

      - name: Verify bootstrap script and executable contract
        shell: pwsh
        run: |
          $contract = & .\agent\installer\techi-agent.exe bootstrap-config-contract
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($contract)) {
            throw "techi-agent bootstrap-config contract probe failed"
          }
          $contract | Set-Content -Path "$env:RUNNER_TEMP\bootstrap-config-contract.json" -Encoding utf8NoBOM
          python scripts/verify_bootstrap_config_contract.py `
            --contract-json "$env:RUNNER_TEMP\bootstrap-config-contract.json" `
            --compare-ref HEAD^

      # ------------------------------------------------------------------ #
      # 8. Build MSI me WiX v7                                              #
      #    BuildCommit (git full SHA) shkon ne HKLM\SOFTWARE\TECHI\Agent,    #
      #    jo ne ProductVersion -- lejon te verifikohet ne PC saktesisht     #
      #    cili commit eshte instaluar pa pyetur "cilin build prove".       #
      # ------------------------------------------------------------------ #
      - name: Build MSI
        shell: pwsh
        working-directory: agent/installer
        run: |
          $buildCommit = "${{ github.sha }}"
          wix build installer.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d SourceDir=. `
            -d Version=${{ steps.version.outputs.version4 }} `
            -d BuildCommit=$buildCommit `
            -o TECHI-Agent-${{ steps.version.outputs.version }}.msi

      - name: Build Agent Update Bridge MSI
        shell: pwsh
        working-directory: agent/installer
        run: |
          $buildCommit = "${{ github.sha }}"
          wix build agent-update.wxs `
            -arch x64 `
            -d SourceDir=. `
            -d Version=${{ steps.version.outputs.version4 }} `
            -d AgentVersion=${{ steps.version.outputs.version }} `
            -d BuildCommit=$buildCommit `
            -o TECHI-Agent-Update-${{ steps.version.outputs.version }}.msi

      - name: Build Remote Support MSI
        shell: pwsh
        working-directory: agent/installer
        run: |
          $buildCommit = "${{ github.sha }}"
          wix build remote-support.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d SourceDir=. `
            -d Version=1.4.8.0 `
            -d BuildCommit=$buildCommit `
            -o TECHI-Remote-Support-1.4.8.msi

      - name: Sign Agent MSI packages when release certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
          WINDOWS_CODE_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGNING_TIMESTAMP_URL }}
        working-directory: agent/installer
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_BASE64)) {
            Write-Host "No production code-signing certificate configured; MSI artifacts will be marked unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'techi-release-signing.pfx'
          if (-not (Test-Path -LiteralPath $pfx)) { throw "Temporary signing certificate is missing" }
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          foreach ($path in @(
            "TECHI-Agent-${{ steps.version.outputs.version }}.msi",
            "TECHI-Agent-Update-${{ steps.version.outputs.version }}.msi",
            "TECHI-Remote-Support-1.4.8.msi"
          )) {
            & $signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_CODE_SIGNING_TIMESTAMP_URL `
              /f $pfx /p $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD `
              /d "TECHI Windows Package" $path
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $path" }
          }

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'techi-release-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Validate Remote Support MSI under SYSTEM
        shell: pwsh
        working-directory: agent/installer
        run: |
          .\test-remote-support-msi.ps1 `
            -MsiPath .\TECHI-Remote-Support-1.4.8.msi `
            -LogDirectory (Join-Path $env:RUNNER_TEMP 'techi-rs-msi-tests')

      - name: Upload Remote Support MSI validation logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Remote-Support-MSI-validation-logs
          path: ${{ runner.temp }}/techi-rs-msi-tests/*.log
          retention-days: 30
          if-no-files-found: warn

      # Standalone techi-agent.exe — the SAME binary embedded in the Agent MSI
      # (built once at step 7). Upload it as the Agent Binary package so a
      # device installed via MSI and a device that ran self_update report the
      # identical SHA256 and both show green in "Needs Agent Update".
      - name: Package standalone agent binary
        shell: pwsh
        working-directory: agent/installer
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Copy-Item techi-agent.exe "techi-agent-$v.exe" -Force
          (Get-FileHash "techi-agent-$v.exe" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "techi-agent-$v.exe.sha256"

      # ------------------------------------------------------------------ #
      # 9. SHA256 checksum                                                   #
      # ------------------------------------------------------------------ #
      - name: Compute SHA256
        shell: pwsh
        working-directory: agent/installer
        run: |
          $msi = "TECHI-Agent-${{ steps.version.outputs.version }}.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $msi" | Out-File "$msi.sha256" -Encoding utf8NoBOM
          Write-Host "SHA256: $hash"
          $bridge = "TECHI-Agent-Update-${{ steps.version.outputs.version }}.msi"
          $bridgeHash = (Get-FileHash $bridge -Algorithm SHA256).Hash.ToLower()
          "$bridgeHash  $bridge" | Out-File "$bridge.sha256" -Encoding utf8NoBOM
          Write-Host "Bridge SHA256: $bridgeHash"
          $agent = "techi-agent-${{ steps.version.outputs.version }}.exe"
          $agentHash = (Get-FileHash $agent -Algorithm SHA256).Hash.ToLower()
          "$agentHash  $agent" | Out-File "$agent.sha256" -Encoding utf8NoBOM
          Write-Host "Agent EXE SHA256: $agentHash"
          $remoteSupport = "TECHI-Remote-Support-1.4.8.msi"
          $remoteSupportHash = (Get-FileHash $remoteSupport -Algorithm SHA256).Hash.ToLower()
          "$remoteSupportHash  $remoteSupport" | Out-File "$remoteSupport.sha256" -Encoding utf8NoBOM
          Write-Host "Remote Support SHA256: $remoteSupportHash"

      - name: Validate MSI embedded agent lineage
        shell: pwsh
        working-directory: agent/installer
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $msi = "TECHI-Agent-$v.msi"
          $standalone = "techi-agent-$v.exe"
          $extract = Join-Path $env:RUNNER_TEMP "techi-agent-msi-extract"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract | Out-Null

          $msiexec = Join-Path $env:SystemRoot 'System32\msiexec.exe'
          $admin = Start-Process -FilePath $msiexec -ArgumentList @('/a', (Resolve-Path $msi), '/qn', "TARGETDIR=$extract") -Wait -PassThru
          if ($admin.ExitCode -ne 0) {
            throw "Administrative MSI extraction failed with exit code $($admin.ExitCode)"
          }

          $expectedEmbedded = Join-Path $extract "CommApp\TechiAgent\techi-agent.exe"
          if (-not (Test-Path -LiteralPath $expectedEmbedded)) {
            $matches = @(Get-ChildItem -LiteralPath $extract -Recurse -Filter techi-agent.exe -ErrorAction SilentlyContinue)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one embedded techi-agent.exe after MSI extraction, found $($matches.Count)"
            }
            $expectedEmbedded = $matches[0].FullName
          }

          $standaloneHash = (Get-FileHash $standalone -Algorithm SHA256).Hash.ToLower()
          $embeddedHash = (Get-FileHash $expectedEmbedded -Algorithm SHA256).Hash.ToLower()
          $standaloneItem = Get-Item -LiteralPath $standalone
          $embeddedItem = Get-Item -LiteralPath $expectedEmbedded
          if ($standaloneHash -ne $embeddedHash) {
            throw "Standalone agent hash $standaloneHash differs from MSI embedded agent hash $embeddedHash"
          }
          if ($standaloneItem.Length -ne $embeddedItem.Length) {
            throw "Standalone agent size $($standaloneItem.Length) differs from MSI embedded size $($embeddedItem.Length)"
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path $msi).Path, 0))
          function Read-MsiValue([string]$sql) {
            $view = $db.OpenView($sql)
            $null = $view.Execute()
            $record = $view.Fetch()
            if ($null -eq $record) { return $null }
            return $record.StringData(1)
          }
          $msiUpgradeCode = Read-MsiValue "SELECT Value FROM Property WHERE Property='UpgradeCode'"
          $msiProductName = Read-MsiValue "SELECT Value FROM Property WHERE Property='ProductName'"
          $expectedAgentOnlyUpgradeCode = "{4F51EEB8-8B56-43A6-A2F0-684C6653B51F}"
          $legacyCombinedUpgradeCode = "{E6AD0A88-5F26-5665-9B1F-70B8C5EE8363}"
          if ($msiUpgradeCode -ne $expectedAgentOnlyUpgradeCode) {
            throw "Agent-only MSI UpgradeCode $msiUpgradeCode does not match $expectedAgentOnlyUpgradeCode"
          }
          if ($msiUpgradeCode -eq $legacyCombinedUpgradeCode) {
            throw "Agent-only MSI must not MajorUpgrade the legacy combined endpoint package"
          }
          if ($msiProductName -ne "TECHI Agent") {
            throw "Unexpected Agent MSI ProductName: $msiProductName"
          }
          $versionInfo = $standaloneItem.VersionInfo
          $expectedVersion = "${{ steps.version.outputs.version4 }}"
          if ($versionInfo.FileVersion -ne $expectedVersion -or
              $versionInfo.ProductVersion -ne $expectedVersion -or
              $versionInfo.CompanyName -ne "TECHI Solutions SH.P.K." -or
              $versionInfo.ProductName -ne "TECHI Platform Endpoint Agent" -or
              $versionInfo.OriginalFilename -ne "techi-agent.exe") {
            throw "Agent PE release metadata is incomplete or inconsistent"
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $standalone)))
          if ($binaryText.Contains("0.0.0-dev")) {
            throw "Agent release binary contains legacy 0.0.0-dev marker"
          }
          $exeSignature = Get-AuthenticodeSignature -FilePath $standalone
          $msiSignature = Get-AuthenticodeSignature -FilePath $msi
          $exeSigned = $exeSignature.Status -eq 'Valid'
          $msiSigned = $msiSignature.Status -eq 'Valid'
          $fleetRolloutEligible = $exeSigned -and $msiSigned
          if ($env:REQUIRE_SIGNED_WINDOWS_ARTIFACTS -eq '1' -and -not $fleetRolloutEligible) {
            throw "Signed Windows release gate is enabled but Agent EXE/MSI signatures are not both valid"
          }
          $summary = $db.SummaryInformation(0)
          $identity = [ordered]@{
            source_commit = "${{ github.sha }}"
            agent_version = $v
            standalone_agent_path = $standalone
            standalone_agent_size = $standaloneItem.Length
            standalone_agent_sha256 = $standaloneHash
            standalone_agent_file_version = $standaloneItem.VersionInfo.FileVersion
            embedded_agent_path = $expectedEmbedded
            embedded_agent_size = $embeddedItem.Length
            embedded_agent_sha256 = $embeddedHash
            embedded_agent_file_version = $embeddedItem.VersionInfo.FileVersion
            embedded_equals_standalone = $true
            pe_company_name = $versionInfo.CompanyName
            pe_product_name = $versionInfo.ProductName
            pe_original_filename = $versionInfo.OriginalFilename
            pe_dev_marker_absent = $true
            agent_authenticode_status = $exeSignature.Status.ToString()
            agent_signer_subject = $(if ($exeSignature.SignerCertificate) { $exeSignature.SignerCertificate.Subject } else { $null })
            agent_timestamped = $null -ne $exeSignature.TimeStamperCertificate
            msi_product_name = $msiProductName
            msi_product_version = Read-MsiValue "SELECT Value FROM Property WHERE Property='ProductVersion'"
            msi_product_code = Read-MsiValue "SELECT Value FROM Property WHERE Property='ProductCode'"
            msi_upgrade_code = $msiUpgradeCode
            legacy_combined_upgrade_code_excluded = $true
            msi_package_code = $summary.Property(9)
            msi_build_commit = Read-MsiValue "SELECT Value FROM Registry WHERE Name='BuildCommit'"
            msi_authenticode_status = $msiSignature.Status.ToString()
            msi_signer_subject = $(if ($msiSignature.SignerCertificate) { $msiSignature.SignerCertificate.Subject } else { $null })
            msi_timestamped = $null -ne $msiSignature.TimeStamperCertificate
            fleet_rollout_eligible = $fleetRolloutEligible
          }
          $identity | ConvertTo-Json -Depth 5 | Set-Content "TECHI-Agent-$v.identity.json" -Encoding utf8NoBOM
          Write-Host "MSI embedded agent matches standalone: $embeddedHash"

      - name: Generate Remote Support MSI identity
        shell: pwsh
        working-directory: agent/installer
        run: |
          $msi = "TECHI-Remote-Support-1.4.8.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path $msi).Path, 0))
          function Read-MsiValue([string]$sql) {
            $view = $db.OpenView($sql)
            $null = $view.Execute()
            $record = $view.Fetch()
            if ($null -eq $record) { return $null }
            return $record.StringData(1)
          }
          function Find-MsiRegistryValue([string]$needle) {
            # Windows Installer SQL has no LIKE operator. Enumerate the small
            # Registry table and apply PowerShell matching instead.
            $view = $db.OpenView("SELECT Value FROM Registry")
            $null = $view.Execute()
            while ($record = $view.Fetch()) {
              $value = $record.StringData(1)
              if ($value -like "*$needle*") { return $value }
            }
            return $null
          }
          $summary = $db.SummaryInformation(0)
          $rsExe = Get-ChildItem -Path "TECHI-Remote-Support" -Recurse -Filter "TECHI Remote Support.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $bridgeExe = Get-Item -LiteralPath "techi-remote-support-bridge.exe"
          $bridgeSignature = Get-AuthenticodeSignature -FilePath $bridgeExe
          $remoteSupportMsiSignature = Get-AuthenticodeSignature -FilePath $msi
          if ($env:REQUIRE_SIGNED_WINDOWS_ARTIFACTS -eq '1' -and
              ($bridgeSignature.Status -ne 'Valid' -or $remoteSupportMsiSignature.Status -ne 'Valid')) {
            throw "Signed Windows release gate requires valid Remote Support bridge and MSI signatures"
          }
          $protocolCommand = Find-MsiRegistryValue "techi-remote-support-bridge.exe"
          if ($protocolCommand -notlike '*techi-remote-support-bridge.exe*%1*') {
            throw "Remote Support protocol is not registered to the secure bridge: $protocolCommand"
          }
          if ($protocolCommand -like '*TECHI Remote Support.exe*') {
            throw "Remote Support protocol still targets the client directly"
          }
          $extract = Join-Path $env:RUNNER_TEMP "techi-rs-msi-extract"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract | Out-Null
          $msiexec = Join-Path $env:SystemRoot 'System32\msiexec.exe'
          $admin = Start-Process -FilePath $msiexec -ArgumentList @('/a', (Resolve-Path $msi), '/qn', "TARGETDIR=$extract") -Wait -PassThru
          if ($admin.ExitCode -ne 0) {
            throw "Remote Support MSI extraction failed with exit code $($admin.ExitCode)"
          }
          $embeddedBridges = @(Get-ChildItem -LiteralPath $extract -Recurse -Filter "techi-remote-support-bridge.exe")
          if ($embeddedBridges.Count -ne 1) {
            throw "Expected exactly one secure bridge in Remote Support MSI, found $($embeddedBridges.Count)"
          }
          $bridgeHash = (Get-FileHash $bridgeExe.FullName -Algorithm SHA256).Hash.ToLower()
          $embeddedBridgeHash = (Get-FileHash $embeddedBridges[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($bridgeHash -ne $embeddedBridgeHash) {
            throw "Embedded Remote Support bridge differs from the tested bridge"
          }
          $bridgeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($embeddedBridges[0].FullName))
          if ($bridgeText -match '\?password=' -or $bridgeText.Contains('--password')) {
            throw "Built bridge contains a forbidden password-bearing URI or command argument"
          }
          $identity = [ordered]@{
            product = "TECHI Remote Support"
            source_commit = "${{ github.sha }}"
            version = "1.4.8"
            msi_sha256 = $hash
            executable_sha256 = $(if ($rsExe) { (Get-FileHash $rsExe.FullName -Algorithm SHA256).Hash.ToLower() } else { $null })
            executable_size = $(if ($rsExe) { $rsExe.Length } else { $null })
            bridge_sha256 = $bridgeHash
            embedded_bridge_sha256 = $embeddedBridgeHash
            embedded_bridge_matches_tested_binary = $true
            bridge_size = $bridgeExe.Length
            bridge_authenticode_status = $bridgeSignature.Status.ToString()
            msi_authenticode_status = $remoteSupportMsiSignature.Status.ToString()
            protocol_handler = $protocolCommand
            msi_product_version = Read-MsiValue "SELECT Value FROM Property WHERE Property='ProductVersion'"
            msi_product_code = Read-MsiValue "SELECT Value FROM Property WHERE Property='ProductCode'"
            msi_upgrade_code = Read-MsiValue "SELECT Value FROM Property WHERE Property='UpgradeCode'"
            msi_package_code = $summary.Property(9)
            msi_build_commit = Read-MsiValue "SELECT Value FROM Registry WHERE Name='BuildCommit'"
          }
          $identity | ConvertTo-Json -Depth 5 | Set-Content "TECHI-Remote-Support-1.4.8.identity.json" -Encoding utf8NoBOM

      - name: Verify secure Remote Support Connect contract
        shell: pwsh
        run: python scripts/verify_remote_support_connect_security.py

      # ------------------------------------------------------------------ #
      # 10. Upload artifact (30 ditë)                                        #
      # ------------------------------------------------------------------ #
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Agent-${{ steps.version.outputs.version }}
          path: |
            agent/installer/TECHI-Agent-${{ steps.version.outputs.version }}.msi
            agent/installer/TECHI-Agent-${{ steps.version.outputs.version }}.msi.sha256
            agent/installer/TECHI-Agent-${{ steps.version.outputs.version }}.identity.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload Agent Update Bridge MSI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Agent-Update-${{ steps.version.outputs.version }}
          path: |
            agent/installer/TECHI-Agent-Update-${{ steps.version.outputs.version }}.msi
            agent/installer/TECHI-Agent-Update-${{ steps.version.outputs.version }}.msi.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload Remote Support MSI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TECHI-Remote-Support-1.4.8
          path: |
            agent/installer/TECHI-Remote-Support-1.4.8.msi
            agent/installer/TECHI-Remote-Support-1.4.8.msi.sha256
            agent/installer/TECHI-Remote-Support-1.4.8.identity.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload standalone agent binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: techi-agent-${{ steps.version.outputs.version }}-exe
          path: |
            agent/installer/techi-agent-${{ steps.version.outputs.version }}.exe
            agent/installer/techi-agent-${{ steps.version.outputs.version }}.exe.sha256
          retention-days: 30
          if-no-files-found: error
