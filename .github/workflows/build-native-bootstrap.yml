name: build-native-bootstrap

# Builds and verifies the native bootstrap/update architecture
# (docs/architecture/native-bootstrap.md). It does NOT sign, publish, activate,
# or deploy anything — it proves the source builds, tests pass, the policy
# schema is honoured, and it emits identity metadata with an explicit
# signed:false status so a later release gate can refuse unsigned binaries once
# signing becomes mandatory.

on:
  push:
    branches: ["**"]
    paths:
      - "agent/**"
      - "backend/app/**"
      - "backend/tests/**"
      - "docs/architecture/native-bootstrap.md"
      - ".github/workflows/build-native-bootstrap.yml"
  pull_request:
    paths:
      - "agent/**"
      - "backend/app/**"
      - "backend/tests/**"
      - "docs/architecture/native-bootstrap.md"
      - ".github/workflows/build-native-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "❌ gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: focused backend package/generator tests
        run: |
          python -m pip install -r ../backend/requirements.txt pytest
          PYTHONPATH=../backend python -m pytest -q \
            ../backend/tests/test_remote_support_bundle_upload.py \
            ../backend/tests/test_agent_package_upload_linux.py \
            ../backend/tests/test_native_bootstrap_generator.py

      - name: windows + linux cross-build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux   GOARCH=amd64 go build ./...

      - name: build native artifacts (bootstrap + RS bundle + sidecars)
        run: scripts/build-native-bootstrap.sh

      - name: verify Remote Support bundle (manifest + round-trip + no secrets)
        run: |
          set -euo pipefail
          zip="$(ls dist/native/TECHI-Remote-Support-*-windows-amd64.zip)"
          man="${zip%.zip}.manifest.json"
          # bundle_sha256 in the manifest must equal the actual zip hash.
          calc="$(sha256sum "$zip" | awk '{print $1}')"
          decl="$(grep -o '"bundle_sha256": *"[0-9a-f]\{64\}"' "$man" | grep -o '[0-9a-f]\{64\}')"
          [ "$calc" = "$decl" ] || { echo "❌ bundle_sha256 mismatch"; exit 1; }
          # The manifest/zip must carry no config/identity/secret files.
          if grep -Eqi '\.toml|id_ed25519|password|config\.json|\.log' "$man"; then
            echo "❌ bundle manifest references a secret/config file"; exit 1
          fi
          tmp="$(mktemp -d)"
          unzip -q "$zip" -d "$tmp"
          if grep -RIEni \
            '(enrollment[_-]?token|api[_-]?secret|password)[[:space:]]*[:=]|BEGIN (RSA |OPENSSH )?PRIVATE KEY' "$tmp"; then
            echo "❌ bundle file contents contain secret-like assignments"; exit 1
          fi
          echo "bundle files: $(grep -c '"path":' "$man")  sha=$calc"

      - name: deterministic Remote Support bundle rebuild
        run: |
          first="$(sha256sum dist/native/TECHI-Remote-Support-*.zip dist/native/TECHI-Remote-Support-*.manifest.json)"
          scripts/build-native-bootstrap.sh >/dev/null
          second="$(sha256sum dist/native/TECHI-Remote-Support-*.zip dist/native/TECHI-Remote-Support-*.manifest.json)"
          [ "$first" = "$second" ] || { echo "❌ bundle rebuild is not deterministic"; exit 1; }

      - name: policy schema validation
        run: |
          go build -o /tmp/techi-bootstrap-host ./cmd/techi-bootstrap
          /tmp/techi-bootstrap-host apply-policy \
            --policy installer/techi-policy.example.json --json
          # Reject a policy that carries a secret-looking field.
          if grep -qi 'enrollment_token\|password\|api_secret' installer/techi-policy.example.json; then
            echo "❌ example policy leaked a secret field"; exit 1
          fi

      - name: signing gate scaffold (informational until signing is mandatory)
        run: |
          echo "signing_status=$(grep -o '\"signing_status\": *\"[^\"]*\"' dist/native/identity.json || true)"
          # To enforce later: set REQUIRE_SIGNED=1 and this build fails while
          # binaries are unsigned. Signing is NOT implemented yet.
          echo "REQUIRE_SIGNED is currently ${REQUIRE_SIGNED:-0}"

      - name: upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: techi-native-bootstrap
          path: |
            agent/dist/native/techi-bootstrap.exe
            agent/dist/native/techi-bootstrap.exe.sha256
            agent/dist/native/identity.json
            agent/dist/native/TECHI-Remote-Support-*-windows-amd64.zip
            agent/dist/native/TECHI-Remote-Support-*-windows-amd64.zip.sha256
            agent/dist/native/TECHI-Remote-Support-*-windows-amd64.manifest.json
            agent/dist/native/TECHI-Remote-Support-*-windows-amd64.identity.json
          if-no-files-found: error
