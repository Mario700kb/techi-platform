name: Build TECHI Agent (Linux)

# Builds the Linux agent binary only. Windows is built by
# build-agent-msi.yml and is deliberately untouched here: that workflow
# triggers on a different branch, this one produces no MSI, and nothing in
# these steps writes to a Windows artifact path.
#
# Added 2026-08-05 for the agent command channel (persistent outbound
# WebSocket, Linux-only) — the first Linux agent change that needed a
# reproducible build rather than a workstation cross-compile.

on:
  push:
    branches:
      - backport/platform-components-92a521c
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux agent (amd64 + arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      # agent/VERSION is the single source of truth, same as the MSI workflow.
      - name: Read agent version
        id: version
        working-directory: agent
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "agent/VERSION is empty" >&2
            exit 1
          fi
          echo "Agent version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Gate the build on the tests. These run natively on Linux here, which
      # is the platform the artifact targets — the command channel and the PTY
      # terminal are both Linux-only, so a cross-compiled-from-macOS check
      # would never have exercised them.
      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test
        working-directory: agent
        run: go test ./... -count=1

      # Cross-compilation targets both architectures in the fleet: amd64 for
      # the servers, arm64 because the package manifest already carries a
      # linux-arm64 agent.
      - name: Build linux/amd64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.AgentVersion=${{ steps.version.outputs.version }}" \
            -trimpath \
            -o "techi-agent-linux-amd64.bin" .

      - name: Build linux/arm64
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.AgentVersion=${{ steps.version.outputs.version }}" \
            -trimpath \
            -o "techi-agent-linux-arm64.bin" .

      # The checksum is the artifact's identity: the package manifest records a
      # sha256 per binary, and PROJECT_STATE requires the deployed agent to be
      # traceable to a build.
      - name: Checksums
        working-directory: agent
        run: |
          sha256sum techi-agent-linux-amd64.bin > techi-agent-linux-amd64.bin.sha256
          sha256sum techi-agent-linux-arm64.bin > techi-agent-linux-arm64.bin.sha256
          cat techi-agent-linux-amd64.bin.sha256 techi-agent-linux-arm64.bin.sha256

      # Fail loudly rather than shipping a binary that is not what it claims:
      # a stripped Go binary for the wrong architecture is easy to miss by eye.
      - name: Verify architectures
        working-directory: agent
        run: |
          file techi-agent-linux-amd64.bin | tee /dev/stderr | grep -q "x86-64"
          file techi-agent-linux-arm64.bin | tee /dev/stderr | grep -q "ARM aarch64"

      - name: Confirm no Windows artifact was produced
        working-directory: agent
        run: |
          if ls *.msi *.exe 2>/dev/null | grep -q .; then
            echo "This workflow must never produce Windows artifacts" >&2
            exit 1
          fi
          echo "no Windows artifacts, as intended"

      - name: Upload Linux agent binaries
        uses: actions/upload-artifact@v4.6.2
        with:
          name: techi-agent-linux-${{ steps.version.outputs.version }}
          path: |
            agent/techi-agent-linux-amd64.bin
            agent/techi-agent-linux-amd64.bin.sha256
            agent/techi-agent-linux-arm64.bin
            agent/techi-agent-linux-arm64.bin.sha256
          retention-days: 30
          if-no-files-found: error
