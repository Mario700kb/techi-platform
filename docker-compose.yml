
services:
  postgres:
    image: postgres:15-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techi}
      # No fallback: a missing password must stop the stack, not start it as "techi".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-techi}
    # Loopback only. The backend reaches it on the compose network and the
    # backup runs `docker exec`; nothing outside the host needs this port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sized for the 2 GB / 1 vCPU host (backend capped at 800 MB):
    # - shared_buffers 256MB (was the 128MB default; heap cache hit was 92%);
    # - random_page_cost 1.1: SSD storage, so index scans are not penalised;
    # - pg_stat_statements: per-query totals, read with
    #   SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC;
    # - log statements over 500 ms, lock waits and temp files;
    # - max_connections 100 (was 200): the backend's request pool reaches 80
    #   (30 + 50 overflow) and maintenance 4, plus backups and admin; 12 are
    #   in use day to day, and each idle slot still reserves memory;
    # - jit off: compiling a plan costs more than it saves on one vCPU for
    #   this OLTP load.
    command: >
      postgres
      -c max_connections=100
      -c jit=off
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c log_min_duration_statement=500
      -c log_lock_waits=on
      -c log_temp_files=0
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techi} -d ${POSTGRES_DB:-techi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    # uvicorn does not reap orphaned children. As PID 1 it inherits every
    # healthcheck process Docker spawns inside the container, so each check
    # left a <defunct> python3 behind — ~5,760/day at the old 15s interval,
    # ~23,000 over a four-day uptime, until the container fell over
    # (2026-08-03 incident). docker-init (tini) becomes PID 1 and reaps them.
    init: true
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Log timestamps in Tirana time. Stored data stays UTC: the code only
      # uses utcnow()/datetime.utcnow(), which ignore TZ (audited 2026-10-05).
      TZ: Europe/Tirane
      # The proxy (nginx-proxy-manager) reaches the backend through the
      # compose network's gateway; trusting X-Forwarded-For from it gives the
      # real client IP for audit, sessions and login rate limiting. Port 8000
      # is closed to the internet (DOCKER-USER TECHI-SEC1A), so only the proxy
      # can set the header.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.18.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    mem_limit: 800m
    memswap_limit: 800m
    volumes:
      - agent_packages:/app/agent_packages
      - /opt/techi/packages:/opt/techi/packages:ro
      # Nightly backups, read-only, for the System status panel (newest dump age/size).
      - /opt/backups/techi:/backups:ro
      - backend_logs:/app/logs
      - backend_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # 30s, not 15s: the image ships no curl/wget, so every check pays a full
      # Python interpreter start. On the single-vCPU production host that cost
      # is not free.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  agent_packages:
  backend_logs:
  backend_data:
